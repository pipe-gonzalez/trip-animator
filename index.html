<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip Animator</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#ffffff; --fg:#1b2430; --muted:#6b7686; --accent:#0b6bcb; --line:#e2e7ee; --bad:#c62828; }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--fg); }
  #map { position:absolute; top:0; right:0; bottom:0; left:0; }
  .panel {
    position:absolute; z-index:1000; top:12px; left:12px; width:380px; max-width:calc(100vw - 24px);
    max-height:calc(100vh - 24px); max-height:calc(100dvh - 24px); overflow-y:auto; overscroll-behavior:contain;
    background:var(--bg); border-radius:14px; box-shadow:0 6px 24px rgba(0,0,0,.18); padding:14px;
  }
  h1 { font-size:16px; margin:0; }
  .phead { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  #toggle { display:none; }
  .stopbox { position:relative; border:1px solid var(--line); border-radius:10px; padding:8px; }
  .l1 { display:flex; align-items:center; gap:6px; }
  .l2 { display:flex; align-items:flex-end; gap:8px; margin:6px 0 0 28px; }
  .dl { display:flex; flex-direction:column; flex:1; min-width:0; font-size:10.5px; color:var(--muted); gap:2px; text-transform:uppercase; letter-spacing:.03em; }
  .badge { width:22px; height:22px; flex:none; border-radius:50%; background:var(--accent); color:#fff; font-size:12px; display:flex; align-items:center; justify-content:center; font-weight:600; }
  .stopbox input[type=text], .stopbox input[type=date] {
    min-width:0; padding:8px 9px; border:1px solid var(--line); border-radius:8px; font-size:13.5px; outline:none; font-family:inherit;
  }
  .stopbox input[type=text] { flex:1; }
  .stopbox input[type=date] { flex:1; color:var(--fg); }
  .stopbox input:focus { border-color:var(--accent); }
  .ib { border:0; background:#eef2f7; border-radius:6px; width:28px; height:28px; cursor:pointer; font-size:13px; flex:none; }
  .ib:disabled { opacity:.35; cursor:default; }
  .sugg {
    position:absolute; left:8px; right:8px; top:42px; z-index:5; background:#fff; border:1px solid var(--line);
    border-radius:8px; max-height:170px; overflow:auto; box-shadow:0 6px 16px rgba(0,0,0,.14); display:none;
  }
  .sugg div { padding:8px 10px; font-size:13px; cursor:pointer; border-bottom:1px solid var(--line); }
  .sugg div:last-child { border-bottom:none; }
  .sugg div:hover { background:#f2f6fb; }
  .legrow { display:flex; align-items:center; gap:8px; margin:5px 0 5px 6px; padding:2px 4px; border-radius:8px; }
  .legrow.bad { outline:2px solid var(--bad); }
  .legrow.active { background:#eaf3ff; }
  .legrow .seg { display:flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; flex:none; }
  .legrow .seg button { border:0; background:#fff; padding:3px 9px; font-size:12px; cursor:pointer; }
  .legrow .seg button.on { background:var(--accent); color:#fff; }
  .legsum { font-size:12px; color:var(--muted); }
  input.plain, select.plain { flex:1; min-width:0; padding:8px 9px; border:1px solid var(--line); border-radius:8px; font-size:13.5px; font-family:inherit; background:#fff; }
  .btn { border:0; border-radius:8px; padding:9px 12px; font-size:14px; cursor:pointer; background:var(--accent); color:#fff; }
  .btn.ghost { background:#eef2f7; color:var(--fg); }
  .btn:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:8px; margin:10px 0; }
  .grow { flex:1; }
  input[type=range] { width:100%; }
  .lab { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .bar { height:6px; background:#eef2f7; border-radius:3px; overflow:hidden; margin:8px 0 4px; }
  .bar > div { height:100%; width:0; background:var(--accent); }
  .info { font-size:12.5px; color:var(--muted); display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .msg { font-size:12.5px; color:#a14b00; margin-top:6px; min-height:16px; line-height:1.35; }
  .vehicle svg { display:block; transform-origin:50% 50%; filter:drop-shadow(0 3px 3px rgba(0,0,0,.35)); }
  /* map stop pins */
  .stop { position:relative; width:0; height:0; }
  .stop .num { position:absolute; left:-12px; top:-12px; width:24px; height:24px; border-radius:50%; background:var(--accent); color:#fff;
    border:2px solid #fff; box-shadow:0 1px 5px rgba(0,0,0,.45); font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .stop .num.reached { background:#1c8c4e; }
  .stop .num.pulse { animation:pulse .9s ease-out 2; }
  @keyframes pulse { 0%{ box-shadow:0 0 0 0 rgba(28,140,78,.7);} 100%{ box-shadow:0 0 0 18px rgba(28,140,78,0);} }
  .stop .lbl { position:absolute; left:16px; top:-16px; background:rgba(255,255,255,.95); border-radius:6px; padding:2px 7px;
    box-shadow:0 1px 4px rgba(0,0,0,.3); white-space:nowrap; font-size:12px; line-height:1.25; }
  .stop .lbl b { display:block; }
  .stop .lbl span { color:var(--muted); font-size:11px; }
  #clock { position:absolute; z-index:1000; top:12px; right:12px; background:rgba(255,255,255,.95); border-radius:10px;
    padding:8px 14px; font-size:18px; font-weight:600; box-shadow:0 4px 16px rgba(0,0,0,.2); display:none; }
  #clock small { display:block; font-size:11px; font-weight:400; color:var(--muted); }
  @media (max-width: 700px) {
    .panel { top:auto; left:0; right:0; bottom:0; width:100%; max-width:none; border-radius:16px 16px 0 0;
      max-height:60vh; max-height:60dvh; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); }
    .phead { margin-bottom:8px; }
    #toggle { display:inline-flex; align-items:center; justify-content:center; width:40px; height:34px; font-size:16px; }
    .panel.collapsed #stops, .panel.collapsed #addrow, .panel.collapsed #saveBox { display:none; }
    .stopbox input[type=text], .stopbox input[type=date], input.plain, select.plain { font-size:16px; }
    .btn { min-height:44px; }
    .ib { width:38px; height:38px; }
    .legrow .seg button { padding:7px 14px; font-size:13px; }
    .leaflet-control-zoom { display:none; }
    #clock { top:8px; right:8px; font-size:15px; padding:6px 10px; }
    .stop .lbl { font-size:11px; padding:1px 5px; }
    .stop .lbl span { font-size:10px; }
  }
</style>
</head>
<body>
<div id="errbar" onclick="this.style.display='none'" style="display:none;position:fixed;left:0;right:0;top:0;z-index:5000;background:#7a1010;color:#fff;font:12px/1.4 system-ui,sans-serif;padding:10px 12px;white-space:pre-wrap;word-break:break-word"></div>
<script>
  // Shows problems on screen, so someone testing on a phone can screenshot them.
  (function () {
    function show(m) {
      var b = document.getElementById('errbar');
      b.style.display = 'block';
      b.textContent += (b.textContent ? '\n\n' : '') + m + '\n\n' + navigator.userAgent + '\n(tap to hide)';
    }
    window.__showErr = show;
    window.addEventListener('error', function (e) {
      if (e && e.target && e.target !== window) return;        // failed resources are handled elsewhere
      show('Problem: ' + (e.message || 'unknown error') + (e.lineno ? ' (line ' + e.lineno + ')' : ''));
    });
    window.addEventListener('unhandledrejection', function (e) {
      show('Problem: ' + ((e.reason && e.reason.message) || e.reason));
    });
  })();
</script>
<div id="map"></div>
<div id="clock"></div>

<div class="panel" id="panel">
  <div class="phead"><h1>Trip Animator</h1><button class="ib" id="toggle" title="Show / hide the trip editor" aria-label="Show or hide the trip editor">▾</button></div>

  <div id="stops"></div>
  <div class="row" id="addrow" style="margin-top:8px">
    <button class="btn ghost grow" id="add">+ Add stop</button>
  </div>

  <div class="row">
    <button class="btn grow" id="go">Show trip</button>
    <button class="btn ghost" id="pp" disabled>Pause</button>
    <button class="btn ghost" id="replay" disabled>↺</button>
  </div>

  <div class="row" id="videorow" style="margin-top:0">
    <button class="btn ghost grow" id="video">🎬 Download animation as video</button>
  </div>

  <div class="bar"><div id="prog"></div></div>
  <div class="info"><span id="dist">—</span><span id="eta">—</span></div>
  <div class="info" style="margin-top:3px"><span id="span">&nbsp;</span></div>
  <div class="msg" id="msg"></div>

  <details id="saveBox" style="margin-top:10px; border-top:1px solid var(--line); padding-top:8px">
    <summary style="cursor:pointer; font-size:13px; font-weight:600">💾 Save &amp; load trips</summary>
    <div class="row" style="margin:8px 0 6px">
      <input type="text" id="tripName" placeholder="Trip name" class="plain">
      <button class="btn" id="saveBtn">Save</button>
    </div>
    <div class="row" style="margin:6px 0">
      <select id="tripList" class="plain"></select>
      <button class="btn ghost" id="loadBtn">Load</button>
      <button class="btn ghost" id="delBtn" title="Delete saved trip">🗑</button>
    </div>
    <div class="row" style="margin:6px 0 0">
      <button class="btn ghost grow" id="exportBtn">Export file</button>
      <button class="btn ghost grow" id="importBtn">Import file</button>
      <input type="file" id="importFile" accept=".json,application/json" style="display:none">
    </div>
  </details>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
if (!window.L) { window.__showErr('The map library could not be loaded. Check the internet connection, and open this page from a web address (a link), not from a file preview.'); }
(function () {
  if (!window.L) return;
  // ---------- Map ----------
  var map = L.map('map', { zoomControl: false, attributionControl: false, worldCopyJump: true }).setView([20, -30], 3);
  function isMobile() { return window.matchMedia('(max-width: 700px)').matches; }
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  L.control.attribution({ position: isMobile() ? 'topleft' : 'bottomright', prefix: false }).addTo(map);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19,
    attribution: 'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, OpenStreetMap contributors'
  }).addTo(map);

  // ---------- Helpers ----------
  var $ = function (id) { return document.getElementById(id); };
  var rad = Math.PI / 180, deg = 180 / Math.PI, R = 6371;

  function haversine(a, b) {
    var dLat = (b[0] - a[0]) * rad, dLon = (b[1] - a[1]) * rad;
    var h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * rad) * Math.cos(b[0] * rad) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
  }

  function greatCircle(a, b, n) {
    var lat1 = a[0] * rad, lon1 = a[1] * rad, lat2 = b[0] * rad, lon2 = b[1] * rad;
    var d = 2 * Math.asin(Math.sqrt(
      Math.sin((lat2 - lat1) / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin((lon2 - lon1) / 2) ** 2));
    if (d === 0) return [a, b];
    var pts = [], prevLon = a[1];
    for (var i = 0; i <= n; i++) {
      var f = i / n;
      var A = Math.sin((1 - f) * d) / Math.sin(d), B = Math.sin(f * d) / Math.sin(d);
      var x = A * Math.cos(lat1) * Math.cos(lon1) + B * Math.cos(lat2) * Math.cos(lon2);
      var y = A * Math.cos(lat1) * Math.sin(lon1) + B * Math.cos(lat2) * Math.sin(lon2);
      var z = A * Math.sin(lat1) + B * Math.sin(lat2);
      var lat = Math.atan2(z, Math.sqrt(x * x + y * y)) * deg;
      var lon = Math.atan2(y, x) * deg;
      while (lon - prevLon > 180) lon -= 360;
      while (lon - prevLon < -180) lon += 360;
      prevLon = lon;
      pts.push([lat, lon]);
    }
    return pts;
  }

  // Lift the middle of a path sideways (toward north) so flights read as an arch on a flat map.
  function archPath(pts) {
    var s = pts[0], e = pts[pts.length - 1];
    var dLat = e[0] - s[0], dLon = e[1] - s[1];
    var len = Math.sqrt(dLat * dLat + dLon * dLon);
    if (len === 0) return pts;
    var pLat = -dLon / len, pLon = dLat / len;
    if (pLat < 0 || (pLat === 0 && pLon < 0)) { pLat = -pLat; pLon = -pLon; }
    var lift = Math.min(len * 0.15, 8);
    var n = pts.length - 1;
    return pts.map(function (p, i) {
      var k = Math.sin(Math.PI * i / n) * lift;
      return [Math.max(-85, Math.min(85, p[0] + pLat * k)), p[1] + pLon * k];
    });
  }

  function bearing(a, b) {
    var lat1 = a[0] * rad, lat2 = b[0] * rad, dLon = (b[1] - a[1]) * rad;
    var y = Math.sin(dLon) * Math.cos(lat2);
    var x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
    return (Math.atan2(y, x) * deg + 360) % 360;
  }

  function buildPath(points) {
    var cum = [0];
    for (var i = 1; i < points.length; i++) cum.push(cum[i - 1] + haversine(points[i - 1], points[i]));
    return { pts: points, cum: cum, total: cum[cum.length - 1] };
  }

  function pointAt(path, f) {
    var target = path.total * f, cum = path.cum, lo = 0, hi = cum.length - 1;
    while (hi - lo > 1) { var mid = (lo + hi) >> 1; if (cum[mid] <= target) lo = mid; else hi = mid; }
    var seg = cum[hi] - cum[lo] || 1, t = (target - cum[lo]) / seg;
    var a = path.pts[lo], b = path.pts[hi];
    var ahead = path.pts[Math.min(hi + 1, path.pts.length - 1)];
    return {
      latlng: [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t],
      heading: bearing(a, hi === lo ? ahead : b),
      idx: lo
    };
  }

  function fmtDuration(h) {
    var m = Math.round(h * 60);
    if (m >= 48 * 60) return Math.round(m / 1440) + ' days';
    return Math.floor(m / 60) + ' h ' + (m % 60) + ' min';
  }

  // ---------- Dates ----------
  function parseD(s) {
    if (!s) return null;
    var p = s.split('-');
    if (p.length !== 3) return null;
    return new Date(+p[0], +p[1] - 1, +p[2]).getTime();
  }
  function fmtD(ms) {
    var d = new Date(ms), opts = { day: 'numeric', month: 'short' };
    if (d.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric';
    return d.toLocaleDateString(undefined, opts);
  }

  // Per stop: a = arrival date, d = departure date (the first stop only departs, the last only arrives)
  function stopDatesOf(arr) {
    return arr.map(function (s, k) {
      return { a: k > 0 ? parseD(s.arrive) : null, d: k < arr.length - 1 ? parseD(s.depart) : null };
    });
  }
  function nightsBetween(a, d) { return (a && d && d > a) ? Math.round((d - a) / 86400000) : 0; }
  function nightsText(n) { return n + (n === 1 ? ' night' : ' nights'); }
  function stopDateLine(k, count, a, d) {
    if (k === 0) return d ? 'Departs ' + fmtD(d) : '';
    if (k === count - 1) return a ? 'Arrives ' + fmtD(a) : '';
    if (a && d) {
      if (a === d) return fmtD(a);
      var nn = nightsBetween(a, d);
      return fmtD(a) + ' → ' + fmtD(d) + (nn > 0 ? ' · ' + nightsText(nn) : '');
    }
    if (a) return 'Arrives ' + fmtD(a);
    if (d) return 'Departs ' + fmtD(d);
    return '';
  }
  function arrivedLabel(leg) {
    return 'Arrived in ' + leg.B.name.split(',')[0] + (leg.stay > 0 ? ' · stays ' + nightsText(leg.stay) : '');
  }

  // ---------- Vehicle icons ----------
  var PLANE_SVG =
    '<svg width="44" height="44" viewBox="0 0 64 64"><path fill="#0b3d73" stroke="#fff" stroke-width="2" ' +
    'd="M32 3c2 0 3.5 2 3.5 5v15l24 14v6L35.5 37v14l6 5v4L32 58l-9.500 3v-4l6-5V37L4.500 43v-6l24-14V8c0-3 1.500-5 3.500-5z"/></svg>';
  var CAR_SVG =
    '<svg width="30" height="48" viewBox="0 0 30 48"><rect x="3" y="2" width="24" height="44" rx="9" fill="#d6342b" stroke="#fff" stroke-width="2"/>' +
    '<rect x="7" y="12" width="16" height="9" rx="3" fill="#bfe3ff"/><rect x="7" y="29" width="16" height="7" rx="3" fill="#bfe3ff"/></svg>';

  function vehicleIcon(mode) {
    var size = mode === 'plane' ? [44, 44] : [30, 48];
    return L.divIcon({
      className: 'vehicle', html: mode === 'plane' ? PLANE_SVG : CAR_SVG,
      iconSize: size, iconAnchor: [size[0] / 2, size[1] / 2]
    });
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function stopIcon(n, name, dateLine, dup) {
    return L.divIcon({
      className: '',
      html: '<div class="stop"><div class="num">' + n + '</div><div class="lbl" style="top:' + (-16 + (dup || 0) * 38) + 'px"><b>' + esc(name) + '</b>' +
            (dateLine ? '<span>' + esc(dateLine) + '</span>' : '') + '</div></div>',
      iconSize: [0, 0], iconAnchor: [0, 0]
    });
  }

  // ---------- Places: built-in cities + online search ----------
  var CITIES = [
    ['Bogotá, Colombia',4.711,-74.072],['Pereira, Colombia',4.813,-75.696],['Medellín, Colombia',6.244,-75.581],['Cali, Colombia',3.452,-76.532],
    ['Cartagena, Colombia',10.391,-75.479],['Barranquilla, Colombia',10.968,-74.781],['Santa Marta, Colombia',11.241,-74.199],
    ['Mexico City, Mexico',19.433,-99.133],['Cancún, Mexico',21.161,-86.851],['Guadalajara, Mexico',20.659,-103.349],
    ['Lima, Peru',-12.046,-77.043],['Cusco, Peru',-13.532,-71.967],['Quito, Ecuador',-0.180,-78.468],
    ['Caracas, Venezuela',10.481,-66.904],['Santiago, Chile',-33.449,-70.669],['Buenos Aires, Argentina',-34.604,-58.382],
    ['São Paulo, Brazil',-23.551,-46.633],['Rio de Janeiro, Brazil',-22.907,-43.173],['Montevideo, Uruguay',-34.901,-56.165],
    ['Panama City, Panama',8.983,-79.517],['San José, Costa Rica',9.928,-84.091],['Havana, Cuba',23.114,-82.366],
    ['New York, USA',40.713,-74.006],['Miami, USA',25.762,-80.192],['Los Angeles, USA',34.052,-118.244],
    ['San Francisco, USA',37.775,-122.419],['Chicago, USA',41.878,-87.630],['Las Vegas, USA',36.170,-115.140],
    ['Toronto, Canada',43.653,-79.383],['Vancouver, Canada',49.283,-123.121],
    ['London, UK',51.507,-0.128],['Paris, France',48.857,2.352],['Madrid, Spain',40.417,-3.704],
    ['Barcelona, Spain',41.385,2.173],['Lisbon, Portugal',38.722,-9.139],['Rome, Italy',41.903,12.496],
    ['Berlin, Germany',52.520,13.405],['Amsterdam, Netherlands',52.368,4.904],['Istanbul, Turkey',41.008,28.978],
    ['Athens, Greece',37.984,23.728],['Moscow, Russia',55.756,37.617],['Reykjavík, Iceland',64.147,-21.943],
    ['Cairo, Egypt',30.044,31.236],['Marrakech, Morocco',31.629,-7.981],['Cape Town, South Africa',-33.925,18.424],
    ['Nairobi, Kenya',-1.292,36.822],['Lagos, Nigeria',6.524,3.379],
    ['Dubai, UAE',25.205,55.271],['Mumbai, India',19.076,72.878],['Delhi, India',28.614,77.209],
    ['Bangkok, Thailand',13.756,100.502],['Singapore',1.352,103.820],['Hong Kong',22.320,114.169],
    ['Beijing, China',39.904,116.407],['Shanghai, China',31.230,121.474],['Seoul, South Korea',37.567,126.978],
    ['Tokyo, Japan',35.682,139.692],['Sydney, Australia',-33.869,151.209],['Auckland, New Zealand',-36.849,174.763]
  ].map(function (c) { return { name: c[0], lat: c[1], lon: c[2] }; });

  function norm(s) { return s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim(); }

  function localSearch(q, limit) {
    var n = norm(q);
    return CITIES.filter(function (c) { return norm(c.name).indexOf(n) !== -1; }).slice(0, limit || 5);
  }

  function geocodeOnline(q, limit) {
    var url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=' + (limit || 1) + '&q=' + encodeURIComponent(q);
    return fetch(url, { headers: { 'Accept': 'application/json' } })
      .then(function (r) { if (!r.ok) throw new Error('geocode'); return r.json(); })
      .then(function (arr) {
        return arr.map(function (x) { return { name: x.display_name, lat: parseFloat(x.lat), lon: parseFloat(x.lon) }; });
      });
  }

  function geocodeAll(q, limit) {
    var local = localSearch(q, limit);
    return geocodeOnline(q, limit).then(function (online) {
      var seen = {}, out = [];
      local.concat(online).forEach(function (r) { if (!seen[r.name]) { seen[r.name] = 1; out.push(r); } });
      return { results: out.slice(0, limit), offline: false };
    }).catch(function () { return { results: local, offline: true }; });
  }

  function shortName(s) { return s.split(',')[0]; }

  // ---------- Car routing ----------
  var ROUTERS = [
    'https://router.project-osrm.org/route/v1/driving/',
    'https://routing.openstreetmap.de/routed-car/route/v1/driving/'
  ];
  var MAX_SNAP_M = 25000;

  function routeJob(base, a, b) {
    return function () {
      var url = base + a.lon + ',' + a.lat + ';' + b.lon + ',' + b.lat + '?overview=full&geometries=geojson';
      var ctrl = new AbortController();
      var timer = setTimeout(function () { ctrl.abort(); }, 15000);
      return fetch(url, { signal: ctrl.signal })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          clearTimeout(timer);
          if (j.code === 'NoRoute' || j.code === 'NoSegment') throw { noRoute: true };
          if (j.code !== 'Ok' || !j.routes || !j.routes.length) throw new Error('bad response');
          var far = (j.waypoints || []).some(function (w) { return w.distance > MAX_SNAP_M; });
          if (far) throw { noRoute: true };

          return {
            pts: rt.geometry.coordinates.map(function (c) { return [c[1], c[0]]; }),
            km: rt.distance / 1000, hours: rt.duration / 3600

        }, function (e) { clearTimeout(timer); throw e; });
    };
  }
  function runJobs(jobs) {
    if (!jobs.length) return Promise.reject({ network: true });
    return jobs[0]().catch(function (e) {
      if (e && e.noRoute) throw e;
      return runJobs(jobs.slice(1));
    });
  }
  function roadRoute(a, b) {
    var jobs = [];
    ROUTERS.forEach(function (base) { var j = routeJob(base, a, b); jobs.push(j, j); });
    return runJobs(jobs);
  }

  // ---------- Itinerary state & editor ----------
  var MAX_STOPS = 10;
  var stops = [
    { text: 'Bogotá', place: null, arrive: '', depart: '' },
    { text: 'Madrid', place: null, arrive: '', depart: '' },
    { text: 'Rome', place: null, arrive: '', depart: '' }
  ];
  var modes = ['plane', 'plane'];   // modes[i] = how to travel from stops[i] to stops[i+1]

  function attachSearch(input, box, s) {
    var timer = null;
    input.addEventListener('input', function () {
      s.text = input.value; s.place = null; S.dirty = true;
      clearTimeout(timer);
      var q = input.value.trim();
      if (q.length < 2) { box.style.display = 'none'; return; }
      timer = setTimeout(function () {
        geocodeAll(q, 6).then(function (o) {
          box.innerHTML = '';
          o.results.forEach(function (r) {
            var d = document.createElement('div');
            d.textContent = r.name;
            d.addEventListener('mousedown', function (e) {
              e.preventDefault();
              s.place = r; s.text = r.name.split(',').slice(0, 2).join(','); S.dirty = true;
              input.value = s.text;
              box.style.display = 'none';
            });
            box.appendChild(d);
          });
          box.style.display = o.results.length ? 'block' : 'none';
        });
      }, 350);
    });
    input.addEventListener('blur', function () { setTimeout(function () { box.style.display = 'none'; }, 150); });
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { box.style.display = 'none'; startTrip(); } });
  }

  function renderStops() {
    var host = $('stops');
    host.innerHTML = '';
    stops.forEach(function (s, i) {
      if (i > 0) {
        var leg = document.createElement('div');
        leg.className = 'legrow';
        leg.innerHTML = '<div class="seg"><button data-m="plane">✈ Plane</button><button data-m="car">🚗 Car</button></div><span class="legsum"></span>';
        [].forEach.call(leg.querySelectorAll('button'), function (b) {
          b.classList.toggle('on', b.dataset.m === modes[i - 1]);
          b.addEventListener('click', function () {
            modes[i - 1] = b.dataset.m; S.dirty = true;
            [].forEach.call(leg.querySelectorAll('button'), function (x) { x.classList.toggle('on', x === b); });
            leg.querySelector('.legsum').textContent = '';
            leg.classList.remove('bad');
          });
        });
        host.appendChild(leg);
      }
      var box = document.createElement('div');
      box.className = 'stopbox';
      box.innerHTML =
        '<div class="l1"><div class="badge">' + (i + 1) + '</div>' +
        '<input type="text" autocomplete="off" placeholder="City or place">' +
        '<button class="ib up" title="Move up">↑</button><button class="ib dn" title="Move down">↓</button>' +
        '<button class="ib rm" title="Remove stop">✕</button></div>' +
        '<div class="l2">' +
        (i > 0 ? '<label class="dl">Arrives<input type="date" class="d-arr"></label>' : '') +
        (i < stops.length - 1 ? '<label class="dl">Departs<input type="date" class="d-dep"></label>' : '') +
        '</div><div class="sugg"></div>';
      var inp = box.querySelector('input[type=text]');
      inp.value = s.text;
      var arr = box.querySelector('.d-arr'), dep = box.querySelector('.d-dep');
      if (arr) { arr.value = s.arrive; arr.addEventListener('change', function () { s.arrive = arr.value; S.dirty = true; }); }
      if (dep) { dep.value = s.depart; dep.addEventListener('change', function () { s.depart = dep.value; S.dirty = true; }); }
      attachSearch(inp, box.querySelector('.sugg'), s);

      var rm = box.querySelector('.rm'), up = box.querySelector('.up'), dn = box.querySelector('.dn');
      rm.disabled = stops.length <= 2;
      up.disabled = i === 0; dn.disabled = i === stops.length - 1;
      rm.addEventListener('click', function () {
        stops.splice(i, 1); modes.splice(Math.max(0, i - 1), 1); S.dirty = true; renderStops();
      });
      up.addEventListener('click', function () { var t = stops[i]; stops[i] = stops[i - 1]; stops[i - 1] = t; S.dirty = true; renderStops(); });
      dn.addEventListener('click', function () { var t = stops[i]; stops[i] = stops[i + 1]; stops[i + 1] = t; S.dirty = true; renderStops(); });
      host.appendChild(box);
    });
    $('add').disabled = stops.length >= MAX_STOPS;
  }

  // ---------- Map layers & animation ----------
  var layers = { routes: [], trails: [], pins: [], vehicle: null };
  var S = { legs: [], i: 0, legElapsed: 0, pause: 0, totalMs: 0, doneMs: 0, playing: false, last: 0, raf: 0, stopDates: [],
            allBounds: null, dirty: true, onDone: null };
  var LEG_MS = 3000;       // every leg takes 3 seconds

  // ---------- Camera ----------
  function camOpts() {
    var pn = document.querySelector('.panel');
    if (isMobile()) return { paddingTopLeft: [24, 70], paddingBottomRight: [24, pn.offsetHeight + 24] };   // leave room for the bottom sheet
    return { paddingTopLeft: [pn.offsetWidth + 40, 60], paddingBottomRight: [60, 60] };
  }
  function focusBounds(b, instant) {
    if (instant) map.fitBounds(b, camOpts());

  }
  function focusAll(instant) { if (S.allBounds) focusBounds(S.allBounds, instant); }
  function focusLeg(i, instant) { focusBounds(L.latLngBounds(S.legs[i].path.pts), instant); }
  function applyCamera(instant) {
    if (!S.legs.length) return;

  }

  function clearAll() {
    cancelAnimationFrame(S.raf);
    S.playing = false;
    layers.routes.concat(layers.trails, layers.pins).forEach(function (l) { map.removeLayer(l); });
    if (layers.vehicle) map.removeLayer(layers.vehicle);
    layers = { routes: [], trails: [], pins: [], vehicle: null };
    $('clock').style.display = 'none';
    [].forEach.call(document.querySelectorAll('.legrow'), function (l) { l.classList.remove('active', 'bad'); });
  }

  function setClock(ms, label) {

    c.style.display = 'block';
  }

  function highlightLeg(i) {

  }

  function markReached(stopIdx, pulse) {

    var el = m.getElement(); if (!el) return;
    var n = el.querySelector('.num'); if (!n) return;
    n.classList.add('reached');
    if (pulse) { n.classList.remove('pulse'); void n.offsetWidth; n.classList.add('pulse'); }
  }

  function resetProgress(instant) {

    layers.pins.forEach(function (m, k) {

    });

    var first = S.legs[0];
    layers.vehicle.setIcon(vehicleIcon(first.mode));
    layers.vehicle.setLatLng(first.path.pts[0]);

  function frame(now) {

  // ---------- Building a trip ----------
  function resolveStop(s, idx) {
    if (s.place) return Promise.resolve(s.place);

    return geocodeAll(q, 1).then(function (o) {
      if (!o.results.length) {
        throw new Error(o.offline
          ? 'Place search is unreachable from this page. For stop ' + (idx + 1) + ', pick a city from the suggestions.'
          : 'Could not find "' + q + '" (stop ' + (idx + 1) + ').');
      }
      s.place = o.results[0];
      return o.results[0];

  }

  function planeLeg(A, B) {

  }

  function addPins(places) {
    var sdp = stopDatesOf(stops);
    places.forEach(function (P, k) {
      var m = L.marker([P.lat, P.lon], { icon: stopIcon(k + 1, shortName(P.name), stopDateLine(k, places.length, sdp[k].a, sdp[k].d), places.slice(0, k).filter(function (q) { return Math.abs(q.lat - P.lat) < 0.05 && Math.abs(q.lon - P.lon) < 0.05; }).length), zIndexOffset: 500, interactive: false }).addTo(map);

    map.fitBounds(bounds, camOpts());

    $('dist').textContent = '—'; $('eta').textContent = '—'; $('span').innerHTML = '&nbsp;';
    $('pp').disabled = true; $('replay').disabled = true;

  }

  function setCollapsed(on) {

    $('toggle').textContent = on ? '▴' : '▾';
  }

  function startTrip() {
    $('msg').textContent = '';
    $('go').disabled = true; $('go').textContent = 'Loading…';
    clearAll();
    S.legs = []; S.onDone = null;
    $('pp').disabled = true; $('replay').disabled = true;
    var sd = stopDatesOf(stops);
    var resolved = [];

    return Promise.all(stops.map(resolveStop)).then(function (places) {
      resolved = places;
      var built = [];

  // ---------- UI wiring ----------

  $('add').addEventListener('click', function () {

  // ---------- Save & load ----------
  var STORE_KEY = 'tripAnimator.trips.v1';

  function tripData(name) {

      var arrive = okD(s.arrive), depart = okD(s.depart);

  function refreshList(select) {

  function downloadBlob(blob, filename) {
    var a = document.createElement('a');

      $('msg').textContent = 'Saved "' + name + '"' + (existed ? ' (replaced the earlier version).' : '.');

      $('msg').textContent = 'This browser would not let the page save. Use "Export file" instead.';
    }
  });

      var t = validateTrip(readStore()[name]);

  $('exportBtn').addEventListener('click', function () {
    var name = $('tripName').value.trim() || 'my-trip';
    var file = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'trip';
    downloadBlob(new Blob([JSON.stringify(tripData(name), null, 2)], { type: 'application/json' }), file + '.json');

  });
  $('importBtn').addEventListener('click', function () { $('importFile').click(); });
  $('importFile').addEventListener('change', function () {
    var f = this.files && this.files[0], input = this;

    reader.onload = function () {

  // ---------- Video (drawn on a canvas, so it works on phones too) ----------

  // The whole video as a list of timed segments (same choreography as the live animation).
  function buildTimeline(W, H, u) {
    var legs = S.legs, n = legs.length;
    var cams = legs.map(function (l) { return fitCam(l.path.pts, W, H, u); });
    var all = []; legs.forEach(function (l) { all = all.concat(l.path.pts); });
    var camAll = fitCam(all, W, H, u);
    var segs = [], t = 0, arrive = [0];
    function add(o) { o.t0 = t; t += o.dur; segs.push(o); }

      add({ type: 'move', leg: i, dur: LEG_MS / 1000, cam: cams[i] });

  function stateAt(T, tl) {

      if (date) { ctx.font = '400 ' + (10.5 * u) + 'px ' + FONT; w2 = ctx.measureText(date).width; }

    ctx.restore(); ctx.shadowBlur = 0;

    var seg = st.seg, clockMs = null, label = '', cl;
    if (seg.type === 'hold') { clockMs = S.stopDates[0].d; label = shortName(S.stops[0].name); }
    else if (seg.type === 'move') {
      cl = legs[seg.leg]; label = shortName(cl.A.name) + ' → ' + shortName(cl.B.name);

      var bw2 = cw + 28 * u, bh2 = 52 * u, bx2 = W - 12 * u - bw2, by2 = 12 * u;

      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = '#1b2430';
      ctx.font = '700 ' + (20 * u) + 'px ' + FONT; ctx.fillText(txt, bx2 + bw2 / 2, by2 + 26 * u);
      ctx.fillStyle = '#6b7686'; ctx.font = '400 ' + (11 * u) + 'px ' + FONT; ctx.fillText(label, bx2 + bw2 / 2, by2 + 43 * u);
    }

    ctx.font = '400 ' + (9 * u) + 'px ' + FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    var crw = ctx.measureText(credit).width + 10 * u;
    ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.fillRect(0, H - 16 * u, crw, 16 * u);

  }

  function loadSvgIcon(svg, w, h) {

  }

  async function recordVideo() {

      var sc = Math.min(window.innerWidth * 0.9 / W, window.innerHeight * 0.68 / H);
