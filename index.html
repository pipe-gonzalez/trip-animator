<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip Animator</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#ffffff; --fg:#1b2430; --muted:#6b7686; --accent:#0b6bcb; --line:#e2e7ee; --bad:#c62828; }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--fg); }
  #map { position:absolute; top:0; right:0; bottom:0; left:0; }
  .panel {
    position:absolute; z-index:1000; top:12px; left:12px; width:380px; max-width:calc(100vw - 24px);
    max-height:calc(100vh - 24px); max-height:calc(100dvh - 24px); overflow-y:auto; overscroll-behavior:contain;
    background:var(--bg); border-radius:14px; box-shadow:0 6px 24px rgba(0,0,0,.18); padding:14px;
  }
  h1 { font-size:16px; margin:0; }
  .phead { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  #toggle { display:none; }
  .stopbox { position:relative; border:1px solid var(--line); border-radius:10px; padding:8px; }
  .l1 { display:flex; align-items:center; gap:6px; }
  .l2 { display:flex; align-items:flex-end; gap:8px; margin:6px 0 0 28px; }
  .dl { display:flex; flex-direction:column; flex:1; min-width:0; font-size:10.5px; color:var(--muted); gap:2px; text-transform:uppercase; letter-spacing:.03em; }
  .badge { width:22px; height:22px; flex:none; border-radius:50%; background:var(--accent); color:#fff; font-size:12px; display:flex; align-items:center; justify-content:center; font-weight:600; }
  .stopbox input[type=text], .stopbox input[type=date] {
    min-width:0; padding:8px 9px; border:1px solid var(--line); border-radius:8px; font-size:13.5px; outline:none; font-family:inherit;
  }
  .stopbox input[type=text] { flex:1; }
  .stopbox input[type=date] { flex:1; color:var(--fg); }
  .stopbox input:focus { border-color:var(--accent); }
  .ib { border:0; background:#eef2f7; border-radius:6px; width:28px; height:28px; cursor:pointer; font-size:13px; flex:none; }
  .ib:disabled { opacity:.35; cursor:default; }
  .sugg {
    position:absolute; left:8px; right:8px; top:42px; z-index:5; background:#fff; border:1px solid var(--line);
    border-radius:8px; max-height:170px; overflow:auto; box-shadow:0 6px 16px rgba(0,0,0,.14); display:none;
  }
  .sugg div { padding:8px 10px; font-size:13px; cursor:pointer; border-bottom:1px solid var(--line); }
  .sugg div:last-child { border-bottom:none; }
  .sugg div:hover { background:#f2f6fb; }
  .legrow { display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin:5px 0 5px 6px; padding:2px 4px; border-radius:8px; }
  .legrow.bad { outline:2px solid var(--bad); }
  .legrow.active { background:#eaf3ff; }
  .legrow .seg { display:flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; flex:none; }
  .legrow .seg button { border:0; background:#fff; padding:4px 11px; font-size:15px; cursor:pointer; }
  .legrow .ins { margin-left:auto; width:auto; padding:0 10px; font-size:12px; }
  .legrow .seg button.on { background:var(--accent); color:#fff; }
  .legsum { font-size:12px; color:var(--muted); }
  input.plain, select.plain { flex:1; min-width:0; padding:8px 9px; border:1px solid var(--line); border-radius:8px; font-size:13.5px; font-family:inherit; background:#fff; }
  .btn { border:0; border-radius:8px; padding:9px 12px; font-size:14px; cursor:pointer; background:var(--accent); color:#fff; }
  .btn.ghost { background:#eef2f7; color:var(--fg); }
  .btn:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:8px; margin:10px 0; }
  .grow { flex:1; }
  input[type=range] { width:100%; }
  .lab { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .bar { height:6px; background:#eef2f7; border-radius:3px; overflow:hidden; margin:8px 0 4px; }
  .bar > div { height:100%; width:0; background:var(--accent); }
  .info { font-size:12.5px; color:var(--muted); display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .msg { font-size:12.5px; color:#a14b00; margin-top:6px; min-height:16px; line-height:1.35; }
  .vehicle svg { display:block; transform-origin:50% 50%; filter:drop-shadow(0 3px 3px rgba(0,0,0,.35)); }
  .l3 { display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin:8px 0 0 28px; }
  .th { position:relative; width:46px; height:46px; }
  .th img { width:46px; height:46px; object-fit:cover; border-radius:6px; border:1px solid var(--line); display:block; }
  .th button { position:absolute; top:-7px; right:-7px; width:20px; height:20px; border-radius:50%; border:0; background:#c62828; color:#fff; font-size:11px; line-height:20px; padding:0; cursor:pointer; }
  .addph { padding:6px 10px; font-size:12.5px; }
  .pcount { font-size:11px; color:var(--muted); }
  #photos { position:fixed; z-index:1200; pointer-events:none; display:none; }
  #photos.on { display:block; }
  #photos.out { opacity:0; transition:opacity .35s; }
  #photos .ph { position:absolute; background:#fff; padding:8px 8px 30px; border-radius:4px; box-shadow:0 10px 28px rgba(0,0,0,.5);
    opacity:0; transform:translate(-50%,-190%) rotate(calc(var(--r,0deg) * 2.5)) scale(1.5);
    transition:transform .3s cubic-bezier(.3,1.25,.5,1), opacity .08s; }
  #photos .ph.in { opacity:1; transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(1); }
  #photos img { display:block; }
  #photos .cap { position:absolute; left:0; right:0; bottom:7px; text-align:center; font:600 13px system-ui,sans-serif; color:#333; }
  #flash { position:fixed; top:0; right:0; bottom:0; left:0; background:#fff; opacity:0; pointer-events:none; z-index:1300; }
  #flash.go { animation:flashgo .18s ease-out; }
  @keyframes flashgo { 0% { opacity:.4; } 100% { opacity:0; } }
  /* map stop pins */
  .stop { position:relative; width:0; height:0; }
  .stop .num { position:absolute; left:-12px; top:-12px; width:24px; height:24px; border-radius:50%; background:var(--accent); color:#fff;
    border:2px solid #fff; box-shadow:0 1px 5px rgba(0,0,0,.45); font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .stop .num.reached { background:#1c8c4e; }
  .stop .num.pulse { animation:pulse .9s ease-out 2; }
  @keyframes pulse { 0%{ box-shadow:0 0 0 0 rgba(28,140,78,.7);} 100%{ box-shadow:0 0 0 18px rgba(28,140,78,0);} }
  .stop .lbl { position:absolute; left:16px; top:-16px; background:rgba(255,255,255,.95); border-radius:6px; padding:2px 7px;
    box-shadow:0 1px 4px rgba(0,0,0,.3); white-space:nowrap; font-size:12px; line-height:1.25; }
  .stop .lbl b { display:block; }
  .stop .lbl span { color:var(--muted); font-size:11px; }
  #clock { position:absolute; z-index:1000; top:12px; right:12px; background:rgba(255,255,255,.95); border-radius:10px;
    padding:8px 14px; font-size:18px; font-weight:600; box-shadow:0 4px 16px rgba(0,0,0,.2); display:none; }
  #clock small { display:block; font-size:11px; font-weight:400; color:var(--muted); }
  @media (max-width: 700px) {
    .panel { top:auto; left:0; right:0; bottom:0; width:100%; max-width:none; border-radius:16px 16px 0 0;
      max-height:60vh; max-height:60dvh; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); }
    .phead { margin-bottom:8px; }
    #toggle { display:inline-flex; align-items:center; justify-content:center; width:40px; height:34px; font-size:16px; }
    .panel.collapsed #stops, .panel.collapsed #addrow, .panel.collapsed #saveBox { display:none; }
    .stopbox input[type=text], .stopbox input[type=date], input.plain, select.plain { font-size:16px; }
    .btn { min-height:44px; }
    .ib { width:38px; height:38px; }
    .legrow .seg button { padding:7px 13px; font-size:16px; }
    .legrow .ins { height:36px; }
    .leaflet-control-zoom { display:none; }
    #clock { top:8px; right:8px; font-size:15px; padding:6px 10px; }
    .stop .lbl { font-size:11px; padding:1px 5px; }
    .stop .lbl span { font-size:10px; }
  }
</style>
</head>
<body>
<div id="errbar" onclick="this.style.display='none'" style="display:none;position:fixed;left:0;right:0;top:0;z-index:5000;background:#7a1010;color:#fff;font:12px/1.4 system-ui,sans-serif;padding:10px 12px;white-space:pre-wrap;word-break:break-word"></div>
<script>
  // Shows problems on screen, so someone testing on a phone can screenshot them.
  (function () {
    function show(m) {
      var b = document.getElementById('errbar');
      b.style.display = 'block';
      b.textContent += (b.textContent ? '\n\n' : '') + m + '\n\n' + navigator.userAgent + '\n(tap to hide)';
    }
    window.__showErr = show;
    window.addEventListener('error', function (e) {
      if (e && e.target && e.target !== window) return;        // failed resources are handled elsewhere
      show('Problem: ' + (e.message || 'unknown error') + (e.lineno ? ' (line ' + e.lineno + ')' : ''));
    });
    window.addEventListener('unhandledrejection', function (e) {
      show('Problem: ' + ((e.reason && e.reason.message) || e.reason));
    });
  })();
</script>
<div id="map"></div>
<div id="clock"></div>
<div id="photos"></div>
<div id="flash"></div>

<div class="panel" id="panel">
  <div class="phead"><h1>Trip Animator <small style="font-weight:400;color:#8a94a6;font-size:11px">v9</small></h1><button class="ib" id="toggle" title="Show / hide the trip editor" aria-label="Show or hide the trip editor">▾</button></div>

  <div id="stops"></div>
  <div class="row" id="addrow" style="margin-top:8px">
    <button class="btn ghost grow" id="add">+ Add stop</button>
  </div>

  <div class="row">
    <button class="btn grow" id="go">Show trip</button>
    <button class="btn ghost" id="pp" disabled>Pause</button>
    <button class="btn ghost" id="replay" disabled>↺</button>
    <button class="btn ghost" id="sound" title="Camera shutter sound on/off" aria-label="Camera shutter sound on or off">🔊</button>
  </div>

  <div class="row" id="videorow" style="margin-top:0">
    <button class="btn ghost grow" id="video">🎬 Download animation as video</button>
  </div>
  <div class="row" id="sharerow" style="margin-top:0">
    <button class="btn ghost grow" id="share">📤 Share trip summary (short video)</button>
  </div>

  <div class="bar"><div id="prog"></div></div>
  <div class="info"><span id="dist">—</span><span id="eta">—</span></div>
  <div class="info" style="margin-top:3px"><span id="span">&nbsp;</span></div>
  <div class="msg" id="msg"></div>

  <details id="saveBox" style="margin-top:10px; border-top:1px solid var(--line); padding-top:8px">
    <summary style="cursor:pointer; font-size:13px; font-weight:600">💾 Save &amp; load trips</summary>
    <div class="row" style="margin:8px 0 6px">
      <input type="text" id="tripName" placeholder="Trip name" class="plain">
      <button class="btn" id="saveBtn">Save</button>
    </div>
    <div class="row" style="margin:6px 0">
      <select id="tripList" class="plain"></select>
      <button class="btn ghost" id="loadBtn">Load</button>
      <button class="btn ghost" id="delBtn" title="Delete saved trip">🗑</button>
    </div>
    <div class="row" style="margin:6px 0 0">
      <button class="btn ghost grow" id="exportBtn">Export file</button>
      <button class="btn ghost grow" id="importBtn">Import file</button>
      <input type="file" id="importFile" accept=".json,application/json" style="display:none">
    </div>
  </details>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
if (!window.L) { window.__showErr('The map library could not be loaded. Check the internet connection, and open this page from a web address (a link), not from a file preview.'); }
(function () {
  if (!window.L) return;
  // ---------- Map ----------
  var map = L.map('map', { zoomControl: false, attributionControl: false, worldCopyJump: true }).setView([20, -30], 3);
  function isMobile() { return window.matchMedia('(max-width: 700px)').matches; }
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  L.control.attribution({ position: isMobile() ? 'topleft' : 'bottomright', prefix: false }).addTo(map);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19,
    attribution: 'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, OpenStreetMap contributors'
  }).addTo(map);

  // ---------- Helpers ----------
  var $ = function (id) { return document.getElementById(id); };
  var rad = Math.PI / 180, deg = 180 / Math.PI, R = 6371;

  function haversine(a, b) {
    var dLat = (b[0] - a[0]) * rad, dLon = (b[1] - a[1]) * rad;
    var h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * rad) * Math.cos(b[0] * rad) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
  }

  function greatCircle(a, b, n) {
    var lat1 = a[0] * rad, lon1 = a[1] * rad, lat2 = b[0] * rad, lon2 = b[1] * rad;
    var d = 2 * Math.asin(Math.sqrt(
      Math.sin((lat2 - lat1) / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin((lon2 - lon1) / 2) ** 2));
    if (d === 0) return [a, b];
    var pts = [], prevLon = a[1];
    for (var i = 0; i <= n; i++) {
      var f = i / n;
      var A = Math.sin((1 - f) * d) / Math.sin(d), B = Math.sin(f * d) / Math.sin(d);
      var x = A * Math.cos(lat1) * Math.cos(lon1) + B * Math.cos(lat2) * Math.cos(lon2);
      var y = A * Math.cos(lat1) * Math.sin(lon1) + B * Math.cos(lat2) * Math.sin(lon2);
      var z = A * Math.sin(lat1) + B * Math.sin(lat2);
      var lat = Math.atan2(z, Math.sqrt(x * x + y * y)) * deg;
      var lon = Math.atan2(y, x) * deg;
      while (lon - prevLon > 180) lon -= 360;
      while (lon - prevLon < -180) lon += 360;
      prevLon = lon;
      pts.push([lat, lon]);
    }
    return pts;
  }

  // Lift the middle of a path sideways (toward north) so flights read as an arch on a flat map.
  function archPath(pts) {
    var s = pts[0], e = pts[pts.length - 1];
    var dLat = e[0] - s[0], dLon = e[1] - s[1];
    var len = Math.sqrt(dLat * dLat + dLon * dLon);
    if (len === 0) return pts;
    var pLat = -dLon / len, pLon = dLat / len;
    if (pLat < 0 || (pLat === 0 && pLon < 0)) { pLat = -pLat; pLon = -pLon; }
    var lift = Math.min(len * 0.15, 8);
    var n = pts.length - 1;
    return pts.map(function (p, i) {
      var k = Math.sin(Math.PI * i / n) * lift;
      return [Math.max(-85, Math.min(85, p[0] + pLat * k)), p[1] + pLon * k];
    });
  }

  function bearing(a, b) {
    var lat1 = a[0] * rad, lat2 = b[0] * rad, dLon = (b[1] - a[1]) * rad;
    var y = Math.sin(dLon) * Math.cos(lat2);
    var x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
    return (Math.atan2(y, x) * deg + 360) % 360;
  }

  function buildPath(points) {
    var cum = [0];
    for (var i = 1; i < points.length; i++) cum.push(cum[i - 1] + haversine(points[i - 1], points[i]));
    return { pts: points, cum: cum, total: cum[cum.length - 1] };
  }

  function pointAt(path, f) {
    var target = path.total * f, cum = path.cum, lo = 0, hi = cum.length - 1;
    while (hi - lo > 1) { var mid = (lo + hi) >> 1; if (cum[mid] <= target) lo = mid; else hi = mid; }
    var seg = cum[hi] - cum[lo] || 1, t = (target - cum[lo]) / seg;
    var a = path.pts[lo], b = path.pts[hi];
    var ahead = path.pts[Math.min(hi + 1, path.pts.length - 1)];
    return {
      latlng: [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t],
      heading: bearing(a, hi === lo ? ahead : b),
      idx: lo
    };
  }

  function fmtDuration(h) {
    var m = Math.round(h * 60);
    if (m >= 48 * 60) return Math.round(m / 1440) + ' days';
    return Math.floor(m / 60) + ' h ' + (m % 60) + ' min';
  }

  // ---------- Dates ----------
  function parseD(s) {
    if (!s) return null;
    var p = s.split('-');
    if (p.length !== 3) return null;
    return new Date(+p[0], +p[1] - 1, +p[2]).getTime();
  }
  function fmtD(ms) {
    var d = new Date(ms), opts = { day: 'numeric', month: 'short' };
    if (d.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric';
    return d.toLocaleDateString(undefined, opts);
  }

  // Per stop: a = arrival date, d = departure date (the first stop only departs, the last only arrives)
  function stopDatesOf(arr) {
    return arr.map(function (s, k) {
      return { a: k > 0 ? parseD(s.arrive) : null, d: k < arr.length - 1 ? parseD(s.depart) : null };
    });
  }
  function nightsBetween(a, d) { return (a && d && d > a) ? Math.round((d - a) / 86400000) : 0; }
  function nightsText(n) { return n + (n === 1 ? ' night' : ' nights'); }
  function stopDateLine(k, count, a, d) {
    if (k === 0) return d ? 'Departs ' + fmtD(d) : '';
    if (k === count - 1) return a ? 'Arrives ' + fmtD(a) : '';
    if (a && d) {
      if (a === d) return fmtD(a);
      var nn = nightsBetween(a, d);
      return fmtD(a) + ' → ' + fmtD(d) + (nn > 0 ? ' · ' + nightsText(nn) : '');
    }
    if (a) return 'Arrives ' + fmtD(a);
    if (d) return 'Departs ' + fmtD(d);
    return '';
  }
  function arrivedLabel(leg) {
    return 'Arrived in ' + leg.B.name.split(',')[0] + (leg.stay > 0 ? ' · stays ' + nightsText(leg.stay) : '');
  }

  // ---------- Vehicle icons ----------
  var PLANE_SVG =
    '<svg width="44" height="44" viewBox="0 0 64 64"><path fill="#0b3d73" stroke="#fff" stroke-width="2" ' +
    'd="M32 3c2 0 3.5 2 3.5 5v15l24 14v6L35.5 37v14l6 5v4L32 58l-9.500 3v-4l6-5V37L4.500 43v-6l24-14V8c0-3 1.500-5 3.500-5z"/></svg>';
  var CAR_SVG =
    '<svg width="30" height="48" viewBox="0 0 30 48"><rect x="3" y="2" width="24" height="44" rx="9" fill="#d6342b" stroke="#fff" stroke-width="2"/>' +
    '<rect x="7" y="12" width="16" height="9" rx="3" fill="#bfe3ff"/><rect x="7" y="29" width="16" height="7" rx="3" fill="#bfe3ff"/></svg>';

  var BUS_SVG =
    '<svg width="32" height="64" viewBox="0 0 32 64"><rect x="2" y="2" width="28" height="60" rx="7" fill="#e08a00" stroke="#fff" stroke-width="2"/>' +
    '<rect x="6" y="6" width="20" height="8" rx="2" fill="#bfe3ff"/><rect x="6" y="19" width="20" height="8" rx="2" fill="#bfe3ff"/>' +
    '<rect x="6" y="31" width="20" height="8" rx="2" fill="#bfe3ff"/><rect x="6" y="43" width="20" height="8" rx="2" fill="#bfe3ff"/></svg>';
  var WALK_SVG =
    '<svg width="30" height="30" viewBox="0 0 30 30"><path d="M15 1.500L21.500 10H8.500z" fill="#7a3db8" stroke="#fff" stroke-width="1.500" stroke-linejoin="round"/>' +
    '<circle cx="15" cy="17" r="10" fill="#7a3db8" stroke="#fff" stroke-width="2"/><circle cx="15" cy="13.500" r="2.700" fill="#fff"/>' +
    '<path d="M10.300 23.500q4.700-9.500 9.400 0z" fill="#fff"/></svg>';

  var BIKE_SVG =
    '<svg width="26" height="46" viewBox="0 0 26 46"><rect x="10.500" y="1" width="5" height="12" rx="2.500" fill="#1a9a6b" stroke="#fff" stroke-width="1.500"/>' +
    '<rect x="10.500" y="33" width="5" height="12" rx="2.500" fill="#1a9a6b" stroke="#fff" stroke-width="1.500"/>' +
    '<rect x="11.800" y="10" width="2.400" height="26" rx="1.200" fill="#0f6e4b"/><rect x="3" y="14" width="20" height="3" rx="1.500" fill="#0f6e4b" stroke="#fff" stroke-width=".8"/>' +
    '<ellipse cx="13" cy="24" rx="5.500" ry="4.800" fill="#1a9a6b" stroke="#fff" stroke-width="1.500"/><circle cx="13" cy="22.500" r="3" fill="#fff"/></svg>';

  // Every way of travelling: label, icon, colour, size of the vehicle marker, routing profile
  var MODES = {
    plane: { label: 'Plane', icon: '✈', color: '#0b3d73', svg: PLANE_SVG, w: 44, h: 44, dash: '6 8',  by: 'plane' },
    car:   { label: 'Car',   icon: '🚗', color: '#d6342b', svg: CAR_SVG,   w: 30, h: 48, dash: null,   by: 'car' },
    bus:   { label: 'Bus',   icon: '🚌', color: '#e08a00', svg: BUS_SVG,   w: 32, h: 64, dash: null,   by: 'bus' },
    bike:  { label: 'Bike',  icon: '🚲', color: '#1a9a6b', svg: BIKE_SVG,  w: 26, h: 46, dash: '10 5', by: 'bike' },
    walk:  { label: 'Walk',  icon: '🚶', color: '#7a3db8', svg: WALK_SVG,  w: 30, h: 30, dash: '2 8',  by: 'foot' }
  };
  function validMode(m) { return typeof m === 'string' && Object.prototype.hasOwnProperty.call(MODES, m) ? m : 'plane'; }

  function plain(x) { return String(x || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim(); }
